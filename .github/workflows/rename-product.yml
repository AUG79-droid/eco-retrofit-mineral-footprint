name: One-off anti-greenwashing product rename

on:
  push:
    paths:
      - '.github/workflows/rename-product.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update visible product name
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '<title>Eco-Retrofit · The Mineral Footprint</title>': '<title>The Mineral Footprint · Retrofit Challenge</title>',
              '<div class="mark">ER</div><div>ECO-RETROFIT<small>The Mineral Footprint · Engineering / Design</small></div>': '<div class="mark">MF</div><div>THE MINERAL FOOTPRINT<small>Retrofit Challenge · Engineering / Design</small></div>',
              'Risk chain used in Eco-Retrofit': 'Risk chain used in The Mineral Footprint',
              "Eco-Retrofit Lead · Gold": "Mineral Footprint Lead · Gold",
          }
          missing = [old for old in replacements if old not in text]
          if missing:
              raise SystemExit(f'Missing expected strings: {missing}')
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rename product to The Mineral Footprint Retrofit Challenge"
          git push
